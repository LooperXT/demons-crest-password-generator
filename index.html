<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="z5H78Ccw5YbXADmGY8EGDDD8yTj-Rlhicn2uGNZbivs" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demon's Crest Password Generator</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-tight: 0.15rem;
      --space-micro: 0.1rem;
      --bg: #121212;
      --surface: #1e1e1e;
      --border: #707070;
      --text: #e8e8e8;
      --muted: #aaa;
      --accent: #8b7355;
      --hover-bg: #252525;
      --active-bg: #2a2a2a;
      --selected: #2a2a2a;
      --selected-border: #c9a227;
      --focus-ring: var(--accent);
      --focus-ring-selected: #e8d48b;
      --radius-sm: 3px;
      --radius-md: 4px;
      --radius-lg: 5px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.3;
    }

    h1 {
      margin: 0;
      padding: var(--space-3) var(--space-4) var(--space-1);
      text-align: center;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .password-area {
      text-align: center;
      margin: var(--space-3) auto var(--space-2);
    }

    .password-grid {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      line-height: 1.45;
      cursor: text;
      min-width: 6em;
    }

    .password-grid .visually-hidden {
      user-select: none;
    }

    .password-grid.placeholder {
      color: var(--muted);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      margin: var(--space-2) 0;
    }

    .control-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: var(--space-2) var(--space-3);
      font-size: 0.85rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      user-select: none;
    }

    #generate,
    #copy {
      min-width: 9em;
    }

    #select-all,
    #select-all-bosses,
    #deselect-all {
      min-width: 16em;
    }

    button:hover {
      border-color: var(--accent);
    }

    button:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    button:active {
      background: var(--active-bg);
    }

    .rules {
      max-width: 20rem;
      margin: var(--space-2) auto var(--space-3);
      padding: var(--space-2) var(--space-3);
    }

    .rules ul,
    .password-grid ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .rules li {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin: var(--space-1) 0;
      font-size: 0.85rem;
    }

    .selectors {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: var(--space-3);
      padding: 0 var(--space-2) var(--space-4);
      max-width: 1400px;
      margin: 0 auto;
    }

    .selectors > .column,
    .selectors > .stack {
      flex: 0 1 190px;
      max-width: 210px;
    }

    .selectors > .column.clear-souls {
      flex: 0 1 520px;
      max-width: 540px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .column {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-2) var(--space-3);
    }

    .column h2 {
      margin: 0 0 var(--space-1);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.03em;
    }

    .item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      padding: var(--space-tight) var(--space-2);
      margin: var(--space-micro) 0;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .item:hover {
      background: var(--hover-bg);
      border-color: transparent;
    }

    .item.selected {
      background: var(--selected);
      border-color: var(--selected-border);
    }

    .item.selected:focus-visible {
      outline-color: var(--focus-ring-selected);
    }

    .rules img,
    .item img {
      width: 20px;
      height: 20px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .item span {
      font-size: 0.8rem;
    }

    .item .check {
      display: none;
    }

    .clear-souls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(8, auto);
      grid-auto-flow: column;
      gap: var(--space-micro) var(--space-2);
    }

    @media (max-width: 700px) {
      .password-grid {
        font-size: 1.6rem;
        letter-spacing: 0.2em;
      }

      #select-all,
      #select-all-bosses,
      #deselect-all {
        min-width: 0;
        width: 100%;
        max-width: 20rem;
      }

      .item {
        padding: var(--space-2) var(--space-2);
      }

      .selectors > .column,
      .selectors > .stack,
      .selectors > .column.clear-souls {
        flex: 1 1 100%;
        max-width: 100%;
      }

      .clear-souls-grid {
        grid-template-columns: 1fr;
        grid-template-rows: none;
        grid-auto-flow: row;
      }
    }

    @media (forced-colors: active) {
      .column,
      button,
      .item {
        border-color: CanvasText;
      }

      .item.selected {
        border-color: Highlight;
        background: transparent;
      }

      button:focus-visible,
      .item.selected:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }

      .password-grid {
        color: CanvasText;
      }

      .password-grid.placeholder {
        color: GrayText;
      }
    }

    @media (forced-colors: active), (prefers-contrast: more) {
      .item .check {
        display: inline;
        visibility: hidden;
        margin-left: auto;
      }

      .item.selected .check {
        visibility: visible;
      }
    }
  </style>
</head>
<body>
  <main>

          <button type="button" class="item" data-key="VELLUM_STAGE_4" aria-pressed="false"><img decoding="async" src="icons/vellum.png" alt="" aria-hidden="true"><span>Stage 4</span></button>

        </div>

          <h2 id="group-urns">Urns</h2>
          <button type="button" class="item" data-key="URN_STAGE_1" aria-pressed="false"><img decoding="async" src="icons/urn.png" alt="" aria-hidden="true"><span>Stage 1</span></button>
          <button type="button" class="item" data-key="URN_STAGE_2" aria-pressed="false"><img decoding="async" src="icons/urn.png" alt="" aria-hidden="true"><span>Stage 2</span></button>
          <button type="button" class="item" data-key="URN_STAGE_3" aria-pressed="false"><img decoding="async" src="icons/urn.png" alt="" aria-hidden="true"><span>Stage 3</span></button>
          <button type="button" class="item" data-key="URN_STAGE_4" aria-pressed="false"><img decoding="async" src="icons/urn.png" alt="" aria-hidden="true"><span>Stage 4</span></button>
          <button type="button" class="item" data-key="URN_STAGE_6" aria-pressed="false"><img decoding="async" src="icons/urn.png" alt="" aria-hidden="true"><span>Stage 6</span></button>

          <button type="button" class="item" data-key="SKULL" aria-pressed="false"><img decoding="async" src="icons/skull.png" alt="" aria-hidden="true"><span>Skull</span></button>
          <button type="button" class="item" data-key="ARMOR" aria-pressed="false"><img decoding="async" src="icons/armor.png" alt="" aria-hidden="true"><span>Armor</span></button>
          <button type="button" class="item" data-key="FANG" aria-pressed="false"><img decoding="async" src="icons/fang.png" alt="" aria-hidden="true"><span>Fang</span></button>

          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_1_SHEER_PRECIPICE" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 1 – Sheer Precipice</span></button>

          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_3_BURN_SCAR" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 3 – Burn Scar</span></button>

          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_3_SCULA" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 3 – Scula</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_5_TEMPLE" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 5 – Temple</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_5_EMERGENCE_CHAMBER" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 5 – Emergence Chamber</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_5_UNDERWATER_TEMPLE" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 5 – Underwater Temple</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_5_HOLOTHURION" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 5 – Holothurion</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_6_ICE_VAULT" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 6 – Ice Vault</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_STAGE_7_FIRST_BELL_TOWER" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Stage 7 – First Bell Tower</span></button>
          <button type="button" class="item" data-key="CLEAR_SOUL_PAGO_TRIO_LEVEL_3" aria-pressed="false"><img decoding="async" src="icons/clearsoul.png" alt="" aria-hidden="true"><span>Pago Trio Level 3</span></button>

    <div id="announcer-a" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <div id="announcer-b" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  </main>

  <script>
    function generatePassword(opts) {
      const GLYPH = "BCDFGHWKXMNYQRZT";
      const COST = [0, 1, 2, 3, 4, 5, 4, 7, 3, 9, 10, 2, 9, 8, 1, 6];
      const DEST = [
        [6, 4, 1, 7, 5, 2, 0, 3],
        [7, 5, 0, 3, 1, 6, 2, 4],
        [4, 1, 6, 0, 5, 2, 3, 7],
        [6, 4, 2, 0, 7, 1, 3, 5],
        [4, 6, 3, 5, 7, 0, 1, 2],
        [2, 7, 3, 4, 6, 1, 0, 5],
        [0, 7, 4, 2, 5, 3, 1, 6],
        [4, 6, 2, 3, 5, 0, 7, 1],
      ];

      const base = [
        (opts.BUSTER << 0) + (opts.TORNADO << 1) +
        (opts.CLAW << 2) + (opts.DEMON_FIRE << 3) +
        (opts.CREST_OF_EARTH << 4) + (opts.CREST_OF_AIR << 5) +
        (opts.CREST_OF_WATER << 6) + (opts.CREST_OF_TIME << 7),

        (opts.CREST_OF_INFINITY << 0) + (opts.VELLUM_STAGE_1 << 1) +
        (opts.VELLUM_STAGE_2 << 2) + (opts.VELLUM_STAGE_3 << 3) +
        (opts.VELLUM_STAGE_4 << 4) + (opts.VELLUM_STAGE_6 << 5) +
        (opts.URN_STAGE_1 << 6) + (opts.URN_STAGE_2 << 7),

        (opts.URN_STAGE_3 << 0) + (opts.URN_STAGE_4 << 1) +
        (opts.URN_STAGE_6 << 2) + (opts.CROWN << 3) +
        (opts.SKULL << 4) + (opts.ARMOR << 5) +
        (opts.FANG << 6) + (opts.HAND << 7),

        (opts.CLEAR_SOUL_STAGE_1_SOMULO << 0) +
        (opts.CLEAR_SOUL_STAGE_1_HIPPOGRIFF << 1) +
        (opts.CLEAR_SOUL_STAGE_2_BELTH << 2) +
        (opts.CLEAR_SOUL_STAGE_3_SCULA << 3) +
        (opts.CLEAR_SOUL_STAGE_5_EMERGENCE_CHAMBER << 4) +
        (opts.CLEAR_SOUL_STAGE_5_HOLOTHURION << 5) +
        (opts.CLEAR_SOUL_STAGE_1_SHEER_PRECIPICE << 6) +
        (opts.CLEAR_SOUL_STAGE_2_MORTUARY_CAVE << 7),

        (opts.CLEAR_SOUL_STAGE_2_CEMETERY << 0) +
        (opts.CLEAR_SOUL_STAGE_3_BURN_SCAR << 1) +
        (opts.CLEAR_SOUL_STAGE_3_SOUL_CHAMBER << 2) +
        (opts.CLEAR_SOUL_PAGO_TRIO_LEVEL_3 << 3) +
        (opts.CLEAR_SOUL_STAGE_5_UNDERWATER_TEMPLE << 4) +
        (opts.CLEAR_SOUL_STAGE_5_TEMPLE << 5) +
        (opts.CLEAR_SOUL_STAGE_6_ICE_VAULT << 6) +
        (opts.CLEAR_SOUL_STAGE_7_FIRST_BELL_TOWER << 7),
      ];

      let best = null;

      for (let unused = 0; unused < 128; unused++) {
        const payload = base.concat([(opts.BOSSES_ONLY_MODE ? 1 : 0) + (unused << 1)]);
        const low = payload.reduce((a, b) => a + b, 0) & 0xF;

        for (let key = 1; key < 15; key++) {
          const mixer = (key << 4) | low;
          const src = payload.map(byte => byte ^ mixer);
          src.push(mixer);
          src.push(src.reduce((a, b) => a + b, 0) & 0xFF);

          const order = new Array(8).fill(0);
          for (let si = 0; si < src.length; si++) {
            const byte = src[si];
            for (let bit = 0; bit < 8; bit++) {
              if (byte & (1 << bit)) {
                order[DEST[si][bit]] |= 1 << si;
              }
            }
          }

          const nibbles = [];
          for (const byte of order) {
            nibbles.push(byte >> 4, byte & 0xF);
          }

          const pw = nibbles.map(n => GLYPH[n]).join("");
          const xi = pw.indexOf("X");
          const ti = pw.indexOf("T");
          const xt = (xi !== -1 && ti !== -1 && xi < ti) ? 0 : 1;
          const cost = nibbles.reduce((sum, n) => sum + COST[n], 0);
          const rank = [cost, xt, pw];

          if (best === null || compareRank(rank, best) < 0) {
            best = rank;
          }
        }
      }

      return best[2];
    }

    function compareRank(a, b) {
      if (a[0] !== b[0]) return a[0] - b[0];
      if (a[1] !== b[1]) return a[1] - b[1];
      return a[2] < b[2] ? -1 : a[2] > b[2] ? 1 : 0;
    }

    const items = document.querySelectorAll(".item");

    function spokenName(text) {
      return text
        .replace(/\s*–\s*/g, ", ")
        .replace(/\s*\(\s*/g, ", ")
        .replace(/\s*\)\s*/g, " ")
        .replace(/(\w)-(\w)/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim();
    }

    document.querySelectorAll("button").forEach(btn => {
      if (btn.hasAttribute("aria-label")) return;
      const text = btn.textContent.replace(/\s+/g, " ").trim();
      const name = spokenName(text);
      if (name !== text) btn.setAttribute("aria-label", name);
    });

    items.forEach(el => {
      const check = document.createElement("span");
      check.className = "check";
      check.setAttribute("aria-hidden", "true");
      check.textContent = "✓";
      el.append(check);
    });

    const announcers = [
      document.getElementById("announcer-a"),
      document.getElementById("announcer-b"),
    ];
    let announcerIndex = 0;

    function announce(text) {
      announcers[1 - announcerIndex].textContent = "";
      announcers[announcerIndex].textContent = text;
      announcerIndex = 1 - announcerIndex;
    }

    function groupsOf(pw) {
      return pw.match(/.{1,4}/g);
    }

    function spellOut(text) {
      return text.split("").join(". ") + ".";
    }

    function spokenItemName(el) {
      return el.getAttribute("aria-label") || el.querySelector("span").textContent.trim();
    }

    function setSelected(el, selected) {
      if (el.classList.contains("selected") === selected) return;
      el.classList.toggle("selected", selected);
      el.setAttribute("aria-pressed", selected);
    }

    function getOptions() {
      const opts = {};
      items.forEach(el => {
        opts[el.dataset.key] = el.classList.contains("selected");
      });
      return opts;
    }

    function setAll(selected, exceptKey) {
      items.forEach(el => setSelected(el, selected && el.dataset.key !== exceptKey));
    }

    const KEY_ITEMS = [
      "BUSTER", "TORNADO", "CLAW", "DEMON_FIRE",
      "CREST_OF_EARTH", "CREST_OF_AIR", "CREST_OF_WATER", "CREST_OF_TIME",
      "CREST_OF_INFINITY",
      "VELLUM_STAGE_1", "VELLUM_STAGE_2", "VELLUM_STAGE_3", "VELLUM_STAGE_4", "VELLUM_STAGE_6",
      "URN_STAGE_1", "URN_STAGE_2", "URN_STAGE_3", "URN_STAGE_4", "URN_STAGE_6",
      "CROWN", "SKULL", "ARMOR", "FANG", "HAND",
      "CLEAR_SOUL_STAGE_1_SOMULO", "CLEAR_SOUL_STAGE_1_HIPPOGRIFF", "CLEAR_SOUL_STAGE_1_SHEER_PRECIPICE",
      "CLEAR_SOUL_STAGE_2_MORTUARY_CAVE", "CLEAR_SOUL_STAGE_2_CEMETERY", "CLEAR_SOUL_STAGE_2_BELTH",
      "CLEAR_SOUL_STAGE_3_BURN_SCAR", "CLEAR_SOUL_STAGE_3_SOUL_CHAMBER", "CLEAR_SOUL_STAGE_3_SCULA",
      "CLEAR_SOUL_STAGE_5_TEMPLE", "CLEAR_SOUL_STAGE_5_EMERGENCE_CHAMBER",
      "CLEAR_SOUL_STAGE_5_UNDERWATER_TEMPLE", "CLEAR_SOUL_STAGE_5_HOLOTHURION",
      "CLEAR_SOUL_STAGE_6_ICE_VAULT", "CLEAR_SOUL_STAGE_7_FIRST_BELL_TOWER",
      "CLEAR_SOUL_PAGO_TRIO_LEVEL_3"
    ];

    const itemByKey = {};
    items.forEach(el => { itemByKey[el.dataset.key] = el; });

    function setKey(key, selected) {
      setSelected(itemByKey[key], selected);
    }

    function isOn(key) {
      return itemByKey[key].classList.contains("selected");
    }

    function applyItemRules(changedKey, turnedOn) {
      const notes = [];
      if (changedKey === "BOSSES_ONLY_MODE") return notes;

      if (changedKey === "CREST_OF_INFINITY" && turnedOn) {
        if (KEY_ITEMS.some(key => !isOn(key))) notes.push("All other key items also selected.");
        KEY_ITEMS.forEach(key => setKey(key, true));
        return notes;
      }

      if (changedKey === "CLEAR_SOUL_STAGE_1_SOMULO" && !turnedOn) {
        if (KEY_ITEMS.some(key => isOn(key))) notes.push("All other key items also deselected.");
        KEY_ITEMS.forEach(key => setKey(key, false));
        return notes;
      }

      if (changedKey !== "CREST_OF_INFINITY" && !turnedOn && isOn("CREST_OF_INFINITY")) {
        setKey("CREST_OF_INFINITY", false);
        notes.push("Infinity also deselected.");
      }

      if (changedKey !== "CLEAR_SOUL_STAGE_1_SOMULO" && turnedOn && !isOn("CLEAR_SOUL_STAGE_1_SOMULO")) {
        setKey("CLEAR_SOUL_STAGE_1_SOMULO", true);
        notes.push("Somulo's Clear Soul also selected.");
      }

      return notes;
    }

    function isLegal(opts) {
      const somulo = !!opts.CLEAR_SOUL_STAGE_1_SOMULO;
      const infinity = !!opts.CREST_OF_INFINITY;
      const anyOther = KEY_ITEMS.some(key => key !== "CLEAR_SOUL_STAGE_1_SOMULO" && opts[key]);
      if (!somulo && anyOther) return false;
      if (infinity && !KEY_ITEMS.every(key => opts[key])) return false;
      return true;
    }

    const passwordGrid = document.getElementById("password-grid");
    let currentPassword = "";

    function showPassword(pw) {
      currentPassword = pw || "";
      passwordGrid.replaceChildren();
      passwordGrid.classList.toggle("placeholder", !pw);

      const list = document.createElement("ul");

      if (!pw) {
        const hint = document.createElement("span");
        hint.className = "visually-hidden";
        hint.textContent = "Make your selections, then press Generate.";
        list.setAttribute("aria-hidden", "true");
        for (let i = 0; i < 4; i++) {
          const line = document.createElement("li");
          line.textContent = "----";
          list.append(line);
        }
        passwordGrid.append(hint, list);
        return;
      }

      groupsOf(pw).forEach(group => {
        const line = document.createElement("li");
        const shown = document.createElement("span");
        shown.setAttribute("aria-hidden", "true");
        shown.textContent = group;
        const spoken = document.createElement("span");
        spoken.className = "visually-hidden";
        spoken.textContent = spellOut(group);
        line.append(shown, spoken);
        list.append(line);
      });
      passwordGrid.append(list);
    }

    function clearPasswordIfShown() {
      if (!currentPassword) return [];
      showPassword("");
      return ["Password cleared."];
    }

    items.forEach(el => {
      el.addEventListener("click", () => {
        const next = !el.classList.contains("selected");
        setSelected(el, next);
        const first = el.dataset.key === "BOSSES_ONLY_MODE"
          ? "Game mode set to " + (next ? "Bosses Only." : "Normal.")
          : spokenItemName(el) + (next ? " selected." : " deselected.");
        const notes = [first]
          .concat(applyItemRules(el.dataset.key, next))
          .concat(clearPasswordIfShown());
        announce(notes.join(" "));
      });
    });

    const flashTimers = new Map();

    function flash(button, message) {
      clearTimeout(flashTimers.get(button));
      button.textContent = message;
      flashTimers.set(button, setTimeout(() => {
        button.textContent = button.getAttribute("aria-label");
      }, 1500));
    }

    const generateButton = document.getElementById("generate");
    const copyButton = document.getElementById("copy");
    const COPY_FAILED = "Could not copy the password.";

    generateButton.addEventListener("click", () => {
      const opts = getOptions();
      if (!isLegal(opts)) {
        showPassword("");
        flash(generateButton, "Error!");
        announce("Cannot generate. This selection breaks the password rules.");
        return;
      }
      const pw = generatePassword(opts);
      const same = pw === currentPassword;
      if (!same) showPassword(pw);
      announce((same ? "Same password. " : "Password generated. ") + spellOut(pw));
    });

    copyButton.addEventListener("click", () => {
      if (!currentPassword) {
        flash(copyButton, "No password!");
        announce("There is nothing to copy yet. Press Generate first.");
        return;
      }
      if (!navigator.clipboard?.writeText) {
        flash(copyButton, "Failed");
        announce(COPY_FAILED);
        return;
      }
      navigator.clipboard.writeText(groupsOf(currentPassword).join(" ")).then(() => {
        flash(copyButton, "Copied!");
        announce("Password copied.");
      }).catch(() => {
        flash(copyButton, "Failed");
        announce(COPY_FAILED);
      });
    });

    function bulkSelect(message, selected, exceptKey) {
      setAll(selected, exceptKey);
      announce([message].concat(clearPasswordIfShown()).join(" "));
    }

    document.getElementById("select-all").addEventListener("click", () => {
      bulkSelect("All key items selected. Game mode set to Normal.", true, "BOSSES_ONLY_MODE");
    });

    document.getElementById("select-all-bosses").addEventListener("click", () => {
      bulkSelect("All key items selected. Game mode set to Bosses Only.", true);
    });

    document.getElementById("deselect-all").addEventListener("click", () => {
      bulkSelect("All key items deselected. Game mode set to Normal.", false);
    });

    showPassword("");
  </script>
</body>
</html>
